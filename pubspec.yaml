name: galaxy_pinterest
description: A polished Pinterest-inspired Flutter app for the Galaxy.ai internship assignment.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^17.3.0
  dio: ^5.10.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  clerk_flutter: ^0.0.18-beta
  shared_preferences: ^2.5.3
  image_picker: ^1.2.1
  share_plus: ^11.1.0
  url_launcher: ^6.3.2
  video_player: ^2.10.1
  path_provider: ^2.1.5
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
